services:
  - type: web
    name: commute-companion-sg
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: LTA_ACCOUNT_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
